<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Baptiste G. - OPS manutention d'aéronerf dans la Marine Nationale. Staff pour diverses communautés Discord et studios de jeux indépendants." />
    <meta name="language" content="fr" />
    <meta http-equiv="Content-Language" content="fr" />
    <meta property="og:site_name" content="Baptiste G." />
    <meta property="og:title" content="Baptiste G. - Staff Discord Communities & Game Studio Maintainer" />
    <meta property="og:image" content="bptisteg.github.io/assets/flag-fr.svg" />
    <meta property="og:image:alt" content="Photo de profil de Baptiste G." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bptisteg.github.io/" />
    <meta name="theme-color" content="#5865F2" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Baptiste G. - Staff Discord Communities & Game Studio Maintainer" />
    <meta name="twitter:image" content="bptisteg.github.io/assets/flag-fr.svg" />
    <link rel="alternate" hreflang="fr" href="https://bptisteg.github.io/" />
    <link rel="alternate" hreflang="en" href="https://bptisteg.github.io/" />
    <link rel="alternate" hreflang="x-default" href="https://bptisteg.github.io/" />
    <title>Baptiste G.</title>
    <link rel="icon" href="assets/pfp.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👋🏻%3C/text%3E%3C/svg%3E" />
    <link rel="preload" href="assets/pfp.png" as="image" />
    <link rel="stylesheet" href="css/style.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.scdn.co https://cdn.discordapp.com; connect-src 'self' https://api.lanyard.rest https://api.github.com wss://api.lanyard.rest;"
    />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="fr" aria-label="Français">
        <img src="assets/flag-fr.svg" alt="" />
        <span>FR</span>
      </button>
      <button type="button" data-lang="en" aria-label="English">
        <img src="assets/flag-gb.svg" alt="" />
        <span>EN</span>
      </button>
    </div>
    <main class="container" id="main-content">
      <header>
        <div class="pfp">
          <img class="avatar" src="assets/pfp.png" alt="Photo de profil de Baptiste G." width="120" height="120" />
          <img
            class="avatar-decoration"
            src="https://cdn.discordapp.com/avatar-decoration-presets/a_89cd445201a0c6c64d46876503d0e90e.png?size=240"
            alt="Décoration Discord"
            aria-hidden="true"
          />
          <span class="status" title="Statut Discord" aria-label="Statut Discord">
            <img class="status-icon" alt="Icône de statut" aria-hidden="true" />
          </span>
        </div>
        <h1 class="name">Baptiste G.</h1>

        <p class="role">
          <span data-i18n="role"></span>
          <img class="flag" src="assets/flag-fr.svg" alt="Drapeau français" loading="lazy" />
        </p>
        <p class="about">
          <span data-i18n="about"></span>
          <img class="emoji" src="assets/1500212724829917365.gif" alt="Emoji Kirby" loading="lazy" />
        </p>
      </header>

      <section class="projects" aria-labelledby="projects-title">
        <h2 id="projects-title" class="visually-hidden">Projets</h2>
        
        <div class="projects-grid">
          <a href="https://tickettool.xyz" target="_blank" rel="noopener noreferrer" class="project loading">
            <div class="project-skeleton">
              <div class="skeleton-image"></div>
              <div class="skeleton-text"></div>
            </div>
            <div class="project-body">
              <div class="project-header">
                <img src="assets/icons/tickettool.png" alt="Logo Ticket Tool" width="32" height="32" loading="lazy" />
                <span>Ticket Tool</span>
              </div>
              <small class="project-description">Support Team</small>
            </div>
          </a>
          <a href="https://discord.gg/tkvtbsd7gA" target="_blank" rel="noopener noreferrer" class="project loading">
            <div class="project-skeleton">
              <div class="skeleton-image"></div>
              <div class="skeleton-text"></div>
            </div>
            <div class="project-body">
              <div class="project-header">
                <img src="assets/meowbot.png" alt="Logo MeowBot" width="32" height="32" loading="lazy" />
                <span>MeowBot</span>
              </div>
              <small class="project-description">Development Team</small>
            </div>
          </a>
          <a href="https://beammp.com" target="_blank" rel="noopener noreferrer" class="project loading">
            <div class="project-skeleton">
              <div class="skeleton-image"></div>
              <div class="skeleton-text"></div>
            </div>
            <div class="project-body">
              <div class="project-header">
                <img src="assets/icons/beammp.png" alt="Logo BeamMP" width="32" height="32" loading="lazy" />
                <span>BeamMP</span>
              </div>
              <small class="project-description">Development & Moderation Team</small>
            </div>
          </a>
        </div>

      <a class="spotify hidden" id="spotify" href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer" aria-live="polite">
        <div class="spotify-art">
          <div class="spotify-skeleton"></div>
          <img id="spotify-art" alt="Album art Spotify" width="48" height="48" />
          <div class="spotify-play-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </div>
          <div class="spotify-pause-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </div>
        </div>
        <div class="spotify-meta">
          <p class="spotify-label" data-i18n="spotifyLabel">Listening to Spotify</p>
          <p class="spotify-song" id="spotify-song"></p>
          <p class="spotify-artist" id="spotify-artist"></p>
          <div class="spotify-progress-bar">
            <div class="spotify-progress" id="spotify-progress"></div>
          </div>
          <div class="spotify-time">
            <span id="spotify-current">0:00</span>
            <span id="spotify-duration">0:00</span>
          </div>
        </div>
      </a>


      <footer>
      </footer>
    </main>

    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <script src="js/i18n.js" defer></script>
    <script src="js/status.js" defer></script>
  </body>
</html>
